<article class="device-card climate active">
  <div class="device-icon">❄️</div>
  <div>
    <p class="device-label">Aire acondicionado</p>
    <h3>{{ temperatura }} °C</h3>
  </div>
  <div class="temperature-controls" aria-label="Control de temperatura">
    <button type="button" class="round-action" (click)="disminuir()" aria-label="Disminuir temperatura">−</button>
    <span>{{ temperatura }} °C</span>
    <button type="button" class="round-action" (click)="aumentar()" aria-label="Aumentar temperatura">+</button>
  </div>
</article>
